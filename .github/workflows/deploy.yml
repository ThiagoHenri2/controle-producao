# Publica o app no GitHub Pages a cada push na main (ou manualmente).
# Se lint, testes ou build falharem, nada é publicado.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um deploy que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir secrets do Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error title=Secret faltando::Cadastre o secret VITE_SUPABASE_URL em Settings > Secrets and variables > Actions (veja docs/setup.md)."
            missing=1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error title=Secret faltando::Cadastre o secret VITE_SUPABASE_ANON_KEY em Settings > Secrets and variables > Actions (veja docs/setup.md)."
            missing=1
          fi
          exit $missing

      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Só a chave pública (anon). NUNCA coloque a service_role aqui.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # O site fica em https://<usuario>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar o site (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
